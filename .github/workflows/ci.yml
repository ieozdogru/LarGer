name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test --no-fatal-infos

      - name: Run tests
        # concurrency=1 avoids Hive singleton races across test files
        run: flutter test --coverage --concurrency=1

      - name: Filter generated files from coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          lcov --ignore-errors unused,empty \
            --remove coverage/lcov.info \
            '*/models.g.dart' \
            -o coverage/lcov.info
          lcov --ignore-errors empty --summary coverage/lcov.info
